name: Deploy backend to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dc/**'
      - 'deploy/ec2/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_URI: ${{ secrets.ECR_REPOSITORY_URL }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        working-directory: dc
        run: |
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          docker tag "$IMAGE_URI" "${{ secrets.ECR_REPOSITORY_URL }}:latest"
          docker push "${{ secrets.ECR_REPOSITORY_URL }}:latest"

      - name: Update EC2 through SSM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=$EC2_INSTANCE_ID" \
            --parameters "{\"commands\":[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URL\",
              \"docker pull $IMAGE_URI\",
              \"docker rm --force dc-api || true\",
              \"docker run --detach --restart unless-stopped --name dc-api --env-file /opt/dc-api/.env --publish 8080:8080 $IMAGE_URI\"
            ]}" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          test "$STATUS" = "Success"
